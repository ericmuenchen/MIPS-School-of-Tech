  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d1343ef6-5188-4bac-a4c1-ad8a6e002537\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<!-- @template name=\"Course Syllabus\" description=\"MIPS one-page course syllabus: header, quick facts, description, units, grading, schedule tables, policies, AI policy. Edit the text in place for each new course.\" -->\n<helmet>\n  <script src=\"2636a12d-d2cc-4450-a03f-70c222c63520\"><\u002Fscript>\n  <style>\n    doc-page:not(:defined){visibility:hidden}\n    .syl h2{ text-wrap:balance; }\n    .syl p, .syl li, .syl td{ text-wrap:pretty; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"doc-page\" from=\"0ce13cc8-04c4-4a47-a190-5ec498201515#/doc-page.js\" size=\"letter\" margin=\"0.7in\" hint-size=\"100%,100%\">\n\n  <div slot=\"header\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:10px;margin-bottom:26px;border-bottom:2px solid var(--color-maize-500);margin-bottom:42px;\">\n    <img src=\"d1e0482f-d0f0-43f4-b0cc-21a038a15478\" alt=\"Michigan International Prep School\" style=\"height:42px;width:auto;\">\n    <span style=\"flex:none;display:inline-flex;align-items:center;color:var(--color-navy-700);font:var(--text-caption);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\">Course Syllabus<\u002Fspan>\n  <\u002Fdiv>\n\n  <div slot=\"footer\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:8px;border-top:1.5px solid var(--color-gray-300);font:var(--text-caption);color:var(--color-gray-600);\">\n    <span>Michigan International Prep School<\u002Fspan>\n    <span>Course Title · 2026–2027<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"syl\" style=\"font:var(--text-body-md);color:var(--color-gray-600);\">\n\n    <!-- ===== TITLE ===== -->\n    <h1 style=\"font:var(--text-display-lg);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:26px 0 12px;\">Course Title<\u002Fh1>\n    <p style=\"font: var(--text-body-lg); color: var(--color-gray-600); margin: 0 0 22px; max-width: 80ch\">A one-sentence hook that tells students what they will make and why it matters, at <em><span style=\"font-style: normal;\">their<\u002Fspan><\u002Fem> pace.<\u002Fp>\n\n    <div style=\"background:var(--color-white);box-shadow:var(--shadow-md);border-radius:var(--radius-lg);overflow:hidden;margin:4px 0 4px;\">\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);\">\n        <div style=\"padding:16px 20px;border-bottom:1px solid var(--color-gray-300);border-right:1px solid var(--color-gray-300);\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-navy-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 0 1 15-6.7L21 8\"><\u002Fpath><path d=\"M21 3v5h-5\"><\u002Fpath><path d=\"M21 12a9 9 0 0 1-15 6.7L3 16\"><\u002Fpath><path d=\"M3 21v-5h5\"><\u002Fpath><\u002Fsvg><div style=\"font:var(--text-caption);text-transform:uppercase;letter-spacing:0.08em;color:var(--color-navy-700);font-weight:700;\">Format<\u002Fdiv><\u002Fdiv><div style=\"font:var(--text-body-md);color:var(--color-ink-900);\">Asynchronous<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-bottom:1px solid var(--color-gray-300);border-right:1px solid var(--color-gray-300);\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-navy-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M3 10h18M8 2v4M16 2v4\"><\u002Fpath><\u002Fsvg><div style=\"font:var(--text-caption);text-transform:uppercase;letter-spacing:0.08em;color:var(--color-navy-700);font-weight:700;\">Term<\u002Fdiv><\u002Fdiv><div style=\"font:var(--text-body-md);color:var(--color-ink-900);white-space:nowrap;\">{{ termLabel }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-bottom:1px solid var(--color-gray-300);\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-navy-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><div style=\"font:var(--text-caption);text-transform:uppercase;letter-spacing:0.08em;color:var(--color-navy-700);font-weight:700;\">Duration<\u002Fdiv><\u002Fdiv><div style=\"font:var(--text-body-md);color:var(--color-ink-900);\">1 semester<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-right:1px solid var(--color-gray-300);\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-navy-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M8 21h8M12 17v4\"><\u002Fpath><\u002Fsvg><div style=\"font:var(--text-caption);text-transform:uppercase;letter-spacing:0.08em;color:var(--color-navy-700);font-weight:700;\">Platform<\u002Fdiv><\u002Fdiv><div style=\"font:var(--text-body-md);color:var(--color-ink-900);\">Google Classroom &amp; [Code.org / CodeHS / MIPS LMS]<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-right:1px solid var(--color-gray-300);\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-navy-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg><div style=\"font:var(--text-caption);text-transform:uppercase;letter-spacing:0.08em;color:var(--color-navy-700);font-weight:700;\">Instructor<\u002Fdiv><\u002Fdiv><div style=\"font:var(--text-body-md);color:var(--color-ink-900);\">Eric Muenchen<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px 20px;border-right:1px solid var(--color-gray-300);\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-navy-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m2 7 10 6 10-6\"><\u002Fpath><\u002Fsvg><div style=\"font:var(--text-caption);text-transform:uppercase;letter-spacing:0.08em;color:var(--color-navy-700);font-weight:700;\">Email<\u002Fdiv><\u002Fdiv><a href=\"mailto:muenchen@miprepschool.org\" style=\"font:var(--text-body-md);color:var(--color-ink-900);text-decoration:none;\">muenchen@miprepschool.org<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"{{ meetingUrl }}\" target=\"_blank\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px;background:var(--color-maize-50);border-top:2px solid var(--color-maize-500);text-decoration:none;\">\n        <div>\n          <span style=\"font:var(--text-body-md);color:var(--color-ink-900);font-weight:700;\">Have a question or need help?<\u002Fspan>\n          <span style=\"font:var(--text-body-sm);color:var(--color-gray-600);\"> Book a 1:1 meeting with me. I'm glad to talk it through.<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--color-navy-700);color:var(--color-white);font:var(--text-body-sm);font-weight:700;padding:7px 18px;border-radius:var(--radius-pill);white-space:nowrap;margin-top:2px;\">Schedule time<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-white)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17 17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <!-- ===== COURSE DESCRIPTION ===== -->\n    <div style=\"height:5px;width:44px;background:var(--color-maize-500);border-radius:var(--radius-pill);margin:40px 0 14px;\"><\u002Fdiv>\n    <h2 style=\"font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:0 0 12px;\">Course Description<\u002Fh2>\n    <p style=\"margin:0 0 14px;\">Open with a plain-language paragraph describing what the course is about and how the term is organized. Keep the voice direct, warm, and student-first.<\u002Fp>\n    <p style=\"margin:0 0 0;\">Follow with a second paragraph naming the major units or arcs of the course. Use <strong style=\"color:var(--color-ink-900);\">bold ink<\u002Fstrong> to call out unit names, and describe the skills students will build in each.<\u002Fp>\n\n    <!-- ===== HOW THIS COURSE WORKS ===== -->\n    <div style=\"height:5px;width:44px;background:var(--color-maize-500);border-radius:var(--radius-pill);margin:40px 0 14px;\"><\u002Fdiv>\n    <h2 style=\"font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:0 0 12px;\">How This Course Works<\u002Fh2>\n    <!-- FIXED: communication always comes through email and Google Classroom; the actual coursework lives in one of Code.org / CodeHS / MIPS LMS. Name the actual one based on what the user uploads/says — ask if unclear. -->\n    <p style=\"margin:0 0 16px;\">This course is fully <strong style=\"color:var(--color-ink-900);\">asynchronous<\u002Fstrong>: there are no required live sessions, so you can do the work when it fits your schedule. Announcements and feedback come through email and Google Classroom, and the work itself lives in [Code.org / CodeHS / MIPS LMS]. I'll set weekly checkpoints to help you stay on pace.<\u002Fp>\n    <div style=\"background:var(--color-maize-50);border-radius:var(--radius-lg);padding:20px 24px;\">\n      <div style=\"font:var(--text-label);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-navy-700);margin-bottom:8px;\">Optional weekly meetup<\u002Fdiv>\n      <p style=\"margin:0;color:var(--color-gray-600);\">Each week I host an optional 30-minute meeting where you can share projects, connect with classmates, play games, and discuss emerging technologies. It's not required, but it's a fun way to stay connected to the class.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- ===== WHAT YOU'LL LEARN ===== -->\n    <div style=\"height:5px;width:44px;background:var(--color-maize-500);border-radius:var(--radius-pill);margin:40px 0 14px;\"><\u002Fdiv>\n    <h2 style=\"font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:0 0 16px;\">What You'll Learn<\u002Fh2>\n    <!-- ADAPTIVE: lead with the big ideas — the reasons this course is worth taking, written to get a student excited, not a dry standards list. Pair each big idea with a simple navy-on-maize icon (see IconSwatch in the design system; swap in whichever Lucide icon best matches each idea). Follow with the concrete learning objectives as one flowing list. Only split into multiple cards (by unit/topic) if the course genuinely has distinct strands worth separating; a single course usually reads better as one full-width card. -->\n    <div style=\"background:var(--color-white);box-shadow:var(--shadow-md);border-radius:var(--radius-lg);padding:24px 26px;\">\n      <p style=\"margin:0 0 20px;font:var(--text-body-lg);color:var(--color-ink-900);\">Open with a big-idea sentence or two: the exciting \"why\" of this course — what students will build, discover, or be able to do that they couldn't before.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin:0 0 22px;\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:14px;background:var(--color-maize-500);color:var(--color-navy-700);\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 2 7l10 5 10-5-10-5Z\"><\u002Fpath><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div>\n            <div style=\"font:var(--text-body-md);font-weight:700;color:var(--color-ink-900);margin-bottom:2px;\">Big idea one<\u002Fdiv>\n            <div style=\"font:var(--text-body-sm);color:var(--color-gray-600);\">A short line naming the theme and why it matters.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:14px;background:var(--color-maize-500);color:var(--color-navy-700);\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m18 16 4-4-4-4M6 8l-4 4 4 4M14.5 4l-5 16\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div>\n            <div style=\"font:var(--text-body-md);font-weight:700;color:var(--color-ink-900);margin-bottom:2px;\">Big idea two<\u002Fdiv>\n            <div style=\"font:var(--text-body-sm);color:var(--color-gray-600);\">A short line naming the theme and why it matters.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:14px;background:var(--color-maize-500);color:var(--color-navy-700);\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <div>\n            <div style=\"font:var(--text-body-md);font-weight:700;color:var(--color-ink-900);margin-bottom:2px;\">Big idea three<\u002Fdiv>\n            <div style=\"font:var(--text-body-sm);color:var(--color-gray-600);\">A short line naming the theme and why it matters.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:20px;line-height:1.7;\">\n        <li>List the concrete skills and knowledge students gain, in the order they'll gain them<\u002Fli>\n        <li>Lead with a verb: use, create, build, apply<\u002Fli>\n        <li>Keep each item a single scannable line<\u002Fli>\n        <li>Five to eight bullets works well for a full semester<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- ===== GRADING ===== -->\n    <div style=\"height:5px;width:44px;background:var(--color-maize-500);border-radius:var(--radius-pill);margin:40px 0 14px;\"><\u002Fdiv>\n    <h2 style=\"font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:0 0 8px;\">Grading<\u002Fh2>\n    <!-- FIXED: every MIPS syllabus explains grading this same simple way — no points breakdown table. Keep this paragraph as-is. -->\n    <p style=\"margin:0 0 18px;\">Your grade is your total score across assignments, projects, and quizzes. Each week you'll get a progress report showing two numbers: your <strong style=\"color: var(--color-ink-900);\">overall grade<\u002Fstrong>, which reflects only the work you've turned in so far, and your <strong style=\"color: var(--color-ink-900);\">relative grade<\u002Fstrong>, which also counts anything not yet submitted as a zero — in other words, what your grade would be if the semester ended today.&nbsp;<\u002Fp>\n\n    <!-- ===== SCHEDULE ===== -->\n    <div style=\"height:5px;width:44px;background:var(--color-maize-500);border-radius:var(--radius-pill);margin:44px 0 14px;\"><\u002Fdiv>\n    <h2 style=\"font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:0 0 6px;\">Semester Schedule<\u002Fh2>\n    <p style=\"margin:0 0 20px;\">A week-by-week roadmap of what to accomplish. If the course is self-paced, treat each row as a target pace. A ★ marks a project or capstone milestone.<\u002Fp>\n\n    <!-- WEEK-BY-WEEK: one row per week, framed around what the student should ACCOMPLISH — not just topics covered. Be as specific as the user's input allows: name the deliverable, skill, or checkpoint due that week. If the input only gives units or months, group loosely; if it gives detailed weekly goals, put them in verbatim. Group rows under the unit they belong to. -->\n    <div style=\"font:var(--text-label);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-navy-700);margin:0 0 10px;\">Unit 1 · Topic<\u002Fdiv>\n    <table style=\"width:100%;border-collapse:collapse;font:var(--text-body-sm);font-size:13.5px;margin-bottom:8px;\">\n      <thead>\n        <tr>\n          <th style=\"text-align:left;background:var(--color-navy-700);color:var(--color-white);font-weight:700;padding:9px 12px;border:1px solid var(--color-navy-700);width:56px;\">Week<\u002Fth>\n          <th style=\"text-align:left;background:var(--color-navy-700);color:var(--color-white);font-weight:700;padding:9px 12px;border:1px solid var(--color-navy-700);width:104px;\">Dates<\u002Fth>\n          <th style=\"text-align:left;background:var(--color-navy-700);color:var(--color-white);font-weight:700;padding:9px 12px;border:1px solid var(--color-navy-700);\">What to accomplish this week<\u002Fth>\n        <\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);color:var(--color-ink-900);font-weight:700;\">1<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Aug 25–28<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Complete orientation; set up your workspace and submit the intro task<\u002Ftd><\u002Ftr>\n        <tr style=\"background:var(--color-gray-100);\"><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);color:var(--color-ink-900);font-weight:700;\">2<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Aug 31–Sep 4<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Finish the first skill lessons; turn in Assignment 1<\u002Ftd><\u002Ftr>\n        <tr><td colspan=\"3\" style=\"padding:7px 12px;border:1px solid var(--color-gray-300);background:var(--color-navy-50);color:var(--color-navy-700);font-style:italic;font-weight:600;\">Break · dates · no new work due<\u002Ftd><\u002Ftr>\n        <tr><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);color:var(--color-ink-900);font-weight:700;\">3<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Sep 8–11<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Apply the unit skills; <strong style=\"color:var(--color-ink-900);\">★ submit the Mini-Project<\u002Fstrong><\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n\n    <div style=\"font:var(--text-label);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-navy-700);margin:26px 0 10px;\">Unit 2 · Topic<\u002Fdiv>\n    <table style=\"width:100%;border-collapse:collapse;font:var(--text-body-sm);font-size:13.5px;\">\n      <thead>\n        <tr>\n          <th style=\"text-align:left;background:var(--color-navy-700);color:var(--color-white);font-weight:700;padding:9px 12px;border:1px solid var(--color-navy-700);width:56px;\">Week<\u002Fth>\n          <th style=\"text-align:left;background:var(--color-navy-700);color:var(--color-white);font-weight:700;padding:9px 12px;border:1px solid var(--color-navy-700);width:104px;\">Dates<\u002Fth>\n          <th style=\"text-align:left;background:var(--color-navy-700);color:var(--color-white);font-weight:700;padding:9px 12px;border:1px solid var(--color-navy-700);\">What to accomplish this week<\u002Fth>\n        <\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);color:var(--color-ink-900);font-weight:700;\">14<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Dec 7–11<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Begin the second unit; complete the opening lessons and reading<\u002Ftd><\u002Ftr>\n        <tr style=\"background:var(--color-gray-100);\"><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);color:var(--color-ink-900);font-weight:700;\">15<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Dec 14–18<\u002Ftd><td style=\"padding:8px 12px;border:1px solid var(--color-gray-300);\">Pull the semester's work together; <strong style=\"color:var(--color-ink-900);\">★ submit the Semester Capstone<\u002Fstrong><\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n\n    <!-- ===== POLICIES ===== -->\n    <div style=\"height:5px;width:44px;background:var(--color-maize-500);border-radius:var(--radius-pill);margin:44px 0 14px;\"><\u002Fdiv>\n    <h2 style=\"font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);margin:0 0 16px;\">Course Policies<\u002Fh2>\n\n    <h3 style=\"font:var(--text-label);font-size:18px;line-height:1.3;color:var(--color-ink-900);margin:0 0 6px;\">Pacing &amp; deadlines<\u002Fh3>\n    <p style=\"margin:0 0 18px;\">Weekly targets keep your progress steady, but you're welcome to work ahead. If you fall behind, reach out early and we can build a plan to help you catch up before the semester ends.<\u002Fp>\n\n    <h3 style=\"font:var(--text-label);font-size:18px;line-height:1.3;color:var(--color-ink-900);margin:0 0 6px;\">Late work<\u002Fh3>\n    <p style=\"margin:0 0 18px;\">Because this course is fully asynchronous, there is no penalty for late work. The weekly schedule is a pacing guide to help you stay on track over the semester, not a set of hard deadlines. Staying close to the pace keeps the workload manageable and makes sure you finish every project before the term ends.<\u002Fp>\n\n    <h3 style=\"font:var(--text-label);font-size:18px;line-height:1.3;color:var(--color-ink-900);margin:0 0 0;\">Communication<\u002Fh3>\n    <p style=\"margin:0 0 0;\">Email me anytime at <a href=\"mailto:muenchen@miprepschool.org\" style=\"color:var(--color-navy-700);\">muenchen@miprepschool.org<\u002Fa> or send me a Google chat. I typically respond within one school day.<\u002Fp>\n\n    <!-- ===== AI POLICY ===== -->\n    <div style=\"margin-top:36px;background:var(--color-navy-700);border-radius:var(--radius-lg);padding:26px 28px;color:var(--color-white);\">\n      <div style=\"font:var(--text-label);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-maize-500);margin-bottom:10px;\">AI Policy<\u002Fdiv>\n      <p style=\"margin:0 0 16px;color:var(--color-white);font:var(--text-display-sm);font-size:22px;line-height:1.35;letter-spacing:var(--tracking-tight);\">The goal is for you to learn to think like a programmer, not to turn in code you did not write.<\u002Fp>\n      <p style=\"margin:0 0 14px;color:var(--color-white);font:var(--text-body-md);line-height:1.7;\">AI tools can be great tutors, and professional computer scientists use AI as a standard part of their workflow. But you are just at the beginning of your computer science education. If AI does all the work and thinking for you, learning never happens.<\u002Fp>\n      <p style=\"margin:0 0 14px;color:var(--color-white);font:var(--text-body-md);line-height:1.7;\">Here is how to acceptably use AI in this course, and anything specific to this class's projects and tools.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;\">\n        <li style=\"display:flex;gap:12px;align-items:flex-start;color:var(--color-white);font:var(--text-body-md);line-height:1.6;\"><span style=\"flex:none;width:8px;height:8px;margin-top:9px;border-radius:var(--radius-pill);background:var(--color-maize-500);\"><\u002Fspan><span>Use AI to explain a concept, translate an error message, or ask \"why doesn't this work?\" — not to generate a finished exercise or project.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;color:var(--color-white);font:var(--text-body-md);line-height:1.6;\"><span style=\"flex:none;width:8px;height:8px;margin-top:9px;border-radius:var(--radius-pill);background:var(--color-maize-500);\"><\u002Fspan><span>You should be able to explain every line you submit. If I see that you have copy/pasted large sections of code into your projects, I will ask to meet with you so you can demonstrate your understanding.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;color:var(--color-white);font:var(--text-body-md);line-height:1.6;\"><span style=\"flex:none;width:8px;height:8px;margin-top:9px;border-radius:var(--radius-pill);background:var(--color-maize-500);\"><\u002Fspan><span>When in doubt, ask me first. I would much rather help you than have you turn in work you cannot explain.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;850px&quot;,&quot;height&quot;:&quot;1100px&quot;},&quot;semester&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;fall&quot;,&quot;options&quot;:[&quot;fall&quot;,&quot;winter&quot;],&quot;tsType&quot;:&quot;\\&quot;fall\\&quot; | \\&quot;winter\\&quot;&quot;,&quot;section&quot;:&quot;Course&quot;},&quot;meetingUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://calendar.app.google/VwDT7bxiLayuJHww9&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    // MIPS academic calendar 2026-2027. A syllabus covers exactly one semester.\n    const semesters = {\n      fall:   { name: \"First Semester\",  short: \"Semester 1\", term: \"Aug 25 \\u2013 Jan 15, 2027\" },\n      winter: { name: \"Second Semester\", short: \"Semester 2\", term: \"Jan 19 \\u2013 Jun 11, 2027\" },\n    };\n    const s = semesters[this.props.semester] || semesters.fall;\n    return {\n      meetingUrl: this.props.meetingUrl ?? \"https://calendar.app.google/VwDT7bxiLayuJHww9\",\n      totalPoints: 450, // keep equal to the sum of the point rows in the Grading table\n\n      semesterName: s.name,\n      semesterShort: s.short,\n      termLabel: s.term,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
