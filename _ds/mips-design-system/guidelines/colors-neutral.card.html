<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & Semantic" subtitle="Ink for headlines, gray for body, red for validation only." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px;font-family:var(--font-ui);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .chip{height:74px;}
  .meta{padding:8px 10px;background:var(--color-white);}
  .name{font:var(--text-label);color:var(--color-ink-900);}
  .hex{font:var(--text-caption);color:var(--color-gray-600);text-transform:uppercase;letter-spacing:.04em;}
  .brd{box-shadow:inset 0 0 0 1px var(--color-gray-300);}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-ink-900)"></div><div class="meta"><div class="name">ink-900 · headlines</div><div class="hex">#32373C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-gray-600)"></div><div class="meta"><div class="name">gray-600 · body</div><div class="hex">#333333</div></div></div>
    <div class="sw"><div class="chip brd" style="background:var(--color-gray-100)"></div><div class="meta"><div class="name">gray-100 · muted</div><div class="hex">#F2F2F2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-red-500)"></div><div class="meta"><div class="name">red-500 · errors</div><div class="hex">#A71000</div></div></div>
  </div>
</body>
</html>
