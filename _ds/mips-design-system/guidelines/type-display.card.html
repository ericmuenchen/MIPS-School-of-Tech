<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--color-white);}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .line{display:flex;align-items:baseline;gap:14px;}
  .tag{font:var(--text-caption);color:var(--color-navy-700);text-transform:uppercase;letter-spacing:.06em;width:112px;flex:none;}
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="tag">display-lg 48</span><span style="font:var(--text-display-lg);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);">Exploring Technology</span></div>
    <div class="line"><span class="tag">display-md 36</span><span style="font:var(--text-display-md);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);">Course Description</span></div>
    <div class="line"><span class="tag">display-sm 28</span><span style="font:var(--text-display-sm);letter-spacing:var(--tracking-tight);color:var(--color-ink-900);">Semester Schedule</span></div>
  </div>
</body>
</html>
