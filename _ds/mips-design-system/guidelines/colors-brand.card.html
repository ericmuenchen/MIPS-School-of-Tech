<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Navy & Maize" subtitle="The maize-and-navy Michigan pairing. Navy anchors, maize accents." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px;font-family:var(--font-ui);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .chip{height:74px;}
  .meta{padding:8px 10px;background:var(--color-white);}
  .name{font:var(--text-label);color:var(--color-ink-900);}
  .hex{font:var(--text-caption);color:var(--color-gray-600);text-transform:uppercase;letter-spacing:.04em;}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-navy-700)"></div><div class="meta"><div class="name">navy-700 · anchor</div><div class="hex">#02225A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-navy-500)"></div><div class="meta"><div class="name">navy-500</div><div class="hex">#294388</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-maize-500)"></div><div class="meta"><div class="name">maize-500 · accent</div><div class="hex">#FFE000</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-maize-300)"></div><div class="meta"><div class="name">maize-300</div><div class="hex">#FDDE30</div></div></div>
  </div>
</body>
</html>
