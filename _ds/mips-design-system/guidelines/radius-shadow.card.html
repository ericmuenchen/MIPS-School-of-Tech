<!-- @dsCard group="Spacing" viewport="700x180" name="Radius & shadow" subtitle="Pill buttons, soft-rounded cards, shallow shadows." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--color-gray-100);font-family:var(--font-ui);display:flex;gap:22px;align-items:center;}
  .box{background:var(--color-white);display:flex;align-items:center;justify-content:center;color:var(--color-navy-700);font:var(--text-caption);font-weight:600;}
  .lab{font:var(--text-caption);color:var(--color-gray-600);text-align:center;margin-top:8px;}
  .item{text-align:center;}
</style>
</head>
<body>
  <div class="item"><div class="box" style="width:120px;height:44px;border-radius:var(--radius-pill);box-shadow:var(--shadow-sm)">pill</div><div class="lab">radius-pill · buttons</div></div>
  <div class="item"><div class="box" style="width:90px;height:70px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md)">lg</div><div class="lab">radius-lg 20 · cards</div></div>
  <div class="item"><div class="box" style="width:90px;height:70px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg)">sm</div><div class="lab">radius-sm 8 · fields</div></div>
</body>
</html>
