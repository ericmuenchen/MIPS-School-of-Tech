<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;padding:20px;background:#fff;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.MIPSDesignSystem_6fe64d;

function Demo() {
  const [checked, setChecked] = React.useState(true);
  const [radio, setRadio] = React.useState('full');
  const [on, setOn] = React.useState(true);
  return (
    <div style={{ display: 'flex', gap: 28, flexWrap: 'wrap', fontFamily: 'var(--font-body)' }}>
      <Input label="Parent Email" required placeholder="you@example.com" />
      <Input label="Phone" error="Please enter a valid phone number" />
      <Select label="Grade Level" options={['Kindergarten', '1st Grade', '2nd Grade']} required />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <Checkbox label="I agree to the enrollment terms" checked={checked} onChange={(e) => setChecked(e.target.checked)} />
        <Radio name="mode" label="Full-Time" checked={radio === 'full'} onChange={() => setRadio('full')} />
        <Radio name="mode" label="Part-Time" checked={radio === 'part'} onChange={() => setRadio('part')} />
        <Switch checked={on} onChange={setOn} label="Email me updates" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
