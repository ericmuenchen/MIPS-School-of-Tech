<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-body);background:#fff;font-size:14px;}
.row{display:flex;gap:20px;}
.item{display:flex;align-items:center;gap:8px;}
.dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;}
</style></head>
<body><div class="row">
<div class="item"><div class="dot" style="background:var(--text-headline);"></div>Headline text</div>
<div class="item"><div class="dot" style="background:var(--text-body);"></div>Body text</div>
<div class="item"><div class="dot" style="background:var(--brand-primary);"></div>Brand / icons</div>
<div class="item"><div class="dot" style="background:var(--accent-primary);"></div>Accent moments</div>
<div class="item"><div class="dot" style="background:var(--state-error);"></div>Validation only</div>
</div></body></html>
