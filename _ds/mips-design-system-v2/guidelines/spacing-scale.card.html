<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--color-white);font-family:var(--font-ui);}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .item{text-align:center;}
  .bar{background:var(--color-navy-700);border-radius:3px;width:28px;margin:0 auto 6px;}
  .n{font:var(--text-caption);color:var(--color-gray-600);}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:16px"></div><div class="n">4</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="n">8</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="n">16</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="n">24</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="n">32</div></div>
    <div class="item"><div class="bar" style="height:96px"></div><div class="n">48</div></div>
  </div>
</body>
</html>
