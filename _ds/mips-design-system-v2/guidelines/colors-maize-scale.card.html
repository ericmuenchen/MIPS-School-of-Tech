<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-body);background:#fff;}
.row{display:flex;gap:12px;}
.sw{flex:1;height:56px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:6px;font:var(--text-caption);color:var(--brand-primary);}
</style></head>
<body><div class="row">
<div class="sw" style="background:var(--color-maize-50);">50</div>
<div class="sw" style="background:var(--color-maize-100);">100</div>
<div class="sw" style="background:var(--color-maize-300);">300</div>
<div class="sw" style="background:var(--color-maize-500);">500</div>
<div class="sw" style="background:var(--color-maize-600);color:#fff;">600</div>
<div class="sw" style="background:var(--color-maize-700);color:#fff;">700</div>
</div></body></html>
