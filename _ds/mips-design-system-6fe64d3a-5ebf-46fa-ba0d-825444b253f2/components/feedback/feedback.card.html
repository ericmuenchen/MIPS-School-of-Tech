<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;padding:20px;background:#fff;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tooltip, Toast, Dialog, Button } = window.MIPSDesignSystem_6fe64d;

function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20, fontFamily: 'var(--font-body)' }}>
      <div style={{ display: 'flex', gap: 40, alignItems: 'center' }}>
        <Tooltip label="Opens in a new tab"><Button size="sm" variant="outline">Hover me</Button></Tooltip>
        <Button size="sm" variant="solid" onClick={() => setOpen(true)}>Open Dialog</Button>
      </div>
      <Toast tone="success">Your enrollment form was submitted!</Toast>
      <Toast tone="error">That field is required.</Toast>
      <Dialog open={open} onClose={() => setOpen(false)} title="Request Info">
        <p style={{ font: 'var(--text-body-sm)', color: 'var(--text-body)' }}>We'll follow up within one business day.</p>
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
