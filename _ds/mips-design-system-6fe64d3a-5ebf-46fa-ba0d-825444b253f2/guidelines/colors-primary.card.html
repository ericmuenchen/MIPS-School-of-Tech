<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>

</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--color-maize-500);color:var(--brand-primary);">#FFE200 Maize</div>
  <div class="sw" style="background:var(--color-navy-700);color:#fff;">#1B2A63 Navy</div>
  <div class="sw" style="background:var(--color-ink-900);color:#fff;">#141414 Ink</div>
  <div class="sw" style="background:var(--color-gray-600);color:#fff;">#555 Gray</div>
</div>
