<!-- @dsCard group="Spacing" viewport="700x150" name="Radius + Shadow" subtitle="Pill buttons, soft-rounded cards, subtle shadows" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);display:flex;gap:20px;align-items:center;}
.box{display:flex;align-items:center;justify-content:center;color:#fff;font:var(--text-caption);}
</style></head>
<body>
<div class="box" style="width:90px;height:44px;background:var(--brand-primary);border-radius:var(--radius-sm);">sm 8px</div>
<div class="box" style="width:90px;height:44px;background:var(--brand-primary);border-radius:var(--radius-md);">md 14px</div>
<div class="box" style="width:90px;height:44px;background:var(--brand-primary);border-radius:var(--radius-lg);">lg 20px</div>
<div class="box" style="width:110px;height:44px;background:var(--brand-primary);border-radius:var(--radius-pill);">pill</div>
<div class="box" style="width:100px;height:60px;background:#fff;color:var(--text-body);box-shadow:var(--shadow-md);border-radius:var(--radius-lg);">shadow-md</div>
</body></html>
